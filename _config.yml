title: tune
description: Your everyday LLM toolkit
theme: just-the-docs
source: src
destination: docs

url: "https://iovdin.github.io"
baseurl: "/tune"

#aux_links:
#  Template Repository: https://github.com/just-the-docs/just-the-docs-template

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: "index.md"
      type: "pages"
    values:
      description: "Your everyday LLM toolkit"


plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-github-metadata
